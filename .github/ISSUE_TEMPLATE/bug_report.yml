name: Bug report
description: Something in Nimiq Pay doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Never share your recovery phrase, PIN or private keys. Remove them from logs and screenshots.
        For security issues, follow [SECURITY.md](https://github.com/nimiq/nimiq-pay-app/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown at the bottom of Settings.
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - App Store / Google Play
        - Built from source
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Logs, screenshots or anything else
