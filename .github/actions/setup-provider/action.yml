name: Setup provider packages
description: Build the pinned provider packages used by the app's local dependencies.

runs:
  using: composite
  steps:
    - name: Checkout provider
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: nimiq/trust-web3-provider
        ref: 182fc351cd28620b6a186ceaa17ca60ef60318a0
        path: trust-web3-provider
        persist-credentials: false

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: '1.3.6'

    - name: Install provider dependencies
      shell: bash
      working-directory: ${{ github.workspace }}/trust-web3-provider
      run: bun install --frozen-lockfile

    - name: Build provider packages
      shell: bash
      working-directory: ${{ github.workspace }}/trust-web3-provider
      run: |
        # Core must exist before its consumers resolve their package entrypoints.
        for package in core nimiq ethereum; do
          (
            cd "packages/$package"
            bun run build:clean
            bun run rollup --config ./rollup.config.js
            bun run build:types
          )
        done
