name: Publish OTA update

on:
  push:
    tags:
      - 'ota-v*'

permissions:
  contents: read

defaults:
  run:
    working-directory: nimiq-pay-app

concurrency:
  group: nimiq-pay-ota-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify OTA
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ota-build
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    env:
      APP_ID: ${{ vars.APP_ID }}

      VITE_ENABLE_NAKA: ${{ vars.VITE_ENABLE_NAKA }}
      VITE_ENABLE_BLUECODE: ${{ vars.VITE_ENABLE_BLUECODE }}
      VITE_ENABLE_MINI_APPS: ${{ vars.VITE_ENABLE_MINI_APPS }}
      VITE_WALKIE_TALKIE_URL: ${{ vars.VITE_WALKIE_TALKIE_URL }}
      VITE_WALKIE_TALKIE_API_KEY: ${{ secrets.VITE_WALKIE_TALKIE_API_KEY }}
      VITE_ETHEREUM_RPC_URL: ${{ vars.VITE_ETHEREUM_RPC_URL }}
      VITE_POLYGON_RPC_URL: ${{ vars.VITE_POLYGON_RPC_URL }}
      VITE_ARBITRUM_RPC_URL: ${{ vars.VITE_ARBITRUM_RPC_URL }}
      VITE_OPTIMISM_RPC_URL: ${{ vars.VITE_OPTIMISM_RPC_URL }}
      VITE_BASE_RPC_URL: ${{ vars.VITE_BASE_RPC_URL }}
      VITE_BNB_RPC_URL: ${{ vars.VITE_BNB_RPC_URL }}
      VITE_SEPOLIA_RPC_URL: ${{ vars.VITE_SEPOLIA_RPC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: nimiq-pay-app
          persist-credentials: false

      - name: Validate OTA tag
        id: version
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"

          if [[ ! "$TAG" =~ ^ota-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid OTA tag: $TAG"
            echo "Expected format: ota-v2.10.3"
            exit 1
          fi

          VERSION="${TAG#ota-v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "OTA tag:     $TAG"
          echo "OTA version: $VERSION"

      - name: Verify tag belongs to main
        id: git
        run: |
          set -euo pipefail

          TAG_COMMIT="$(git rev-parse HEAD)"

          if ! git merge-base --is-ancestor \
            "$TAG_COMMIT" \
            "origin/main"
          then
            echo "ERROR: $GITHUB_REF_NAME is not based on main."
            echo "Tagged commit: $TAG_COMMIT"
            exit 1
          fi

          echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

          echo "Tagged commit is contained in main:"
          echo "$TAG_COMMIT"

      - name: Validate OTA configuration
        id: ota
        run: |
          set -euo pipefail

          if [ ! -f ota.json ]; then
            echo "ERROR: ota.json does not exist."
            exit 1
          fi

          if ! jq -e '
            .compatibleNativeVersions |
            type == "array" and
            length > 0 and
            all(.[];
              type == "string" and
              test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")
            )
          ' ota.json > /dev/null; then
            echo "ERROR: ota.json must list compatible native versions in X.Y.Z format."
            exit 1
          fi

          NATIVE_VERSIONS="$(
            jq -c '.compatibleNativeVersions' ota.json
          )"

          echo "native_versions=$NATIVE_VERSIONS" \
            >> "$GITHUB_OUTPUT"

          echo "Compatible native versions:"
          echo "$NATIVE_VERSIONS"

      - name: Validate build settings
        run: |
          set -euo pipefail
          : "${APP_ID:?Missing ota-build APP_ID}"

          # The infrastructure test targets only the synthetic native version 0.0.0.
          if ! jq -e '.compatibleNativeVersions == ["0.0.0"]' ota.json > /dev/null; then
            for NAME in VITE_WALKIE_TALKIE_URL VITE_WALKIE_TALKIE_API_KEY; do
              if [ -z "${!NAME}" ]; then
                echo "ERROR: Missing ota-build setting: $NAME"
                exit 1
              fi
            done

            for NAME in VITE_ENABLE_NAKA VITE_ENABLE_BLUECODE VITE_ENABLE_MINI_APPS; do
              if [[ "${!NAME}" != true && "${!NAME}" != false ]]; then
                echo "ERROR: $NAME must explicitly be true or false."
                exit 1
              fi
            done
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          package_json_file: nimiq-pay-app/package.json

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: nimiq-pay-app/pnpm-lock.yaml

      - name: Setup provider packages
        uses: ./nimiq-pay-app/.github/actions/setup-provider

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Capgo CLI
        run: |
          set -euo pipefail

          if [ ! -x ./node_modules/.bin/capgo ]; then
            echo "ERROR: @capgo/cli is not installed locally."
            echo "Run: pnpm add --save-dev @capgo/cli"
            exit 1
          fi

          ./node_modules/.bin/capgo --version

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm exec vitest run

      - name: Build application
        run: pnpm build:web

      - name: Create unsigned OTA bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/capgo bundle zip \
            "$APP_ID" --bundle "$VERSION" --name bundle.zip --key-v2 --json > bundle.json
          RAW_CHECKSUM="$(jq -er '.checksum | select(test("^[0-9a-f]{64}$"))' bundle.json)"
          printf '%s  %s\n' "$RAW_CHECKSUM" bundle.zip | sha256sum --check

      - name: Name build artifact
        id: artifact
        run: echo "name=ota-unsigned-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: nimiq-pay-app/bundle.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Sign and publish production OTA
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
    env:
      UPDATE_CDN: ${{ vars.UPDATE_CDN }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ENDPOINT: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REGION: auto
      AWS_DEFAULT_REGION: auto

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: nimiq-pay-app
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.capgo_key_v2.pub
            /ota.json
            /scripts/encrypt-ota.mjs

      - name: Validate OTA tag
        id: version
        run: |
          set -euo pipefail

          TAG="$GITHUB_REF_NAME"

          if [[ ! "$TAG" =~ ^ota-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid OTA tag: $TAG"
            echo "Expected format: ota-v2.10.3"
            exit 1
          fi

          VERSION="${TAG#ota-v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "OTA tag:     $TAG"
          echo "OTA version: $VERSION"

      - name: Verify tag belongs to main
        id: git
        run: |
          set -euo pipefail

          TAG_COMMIT="$(git rev-parse HEAD)"

          if ! git merge-base --is-ancestor \
            "$TAG_COMMIT" \
            "origin/main"
          then
            echo "ERROR: $GITHUB_REF_NAME is not based on main."
            echo "Tagged commit: $TAG_COMMIT"
            exit 1
          fi

          echo "commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

          echo "Tagged commit is contained in main:"
          echo "$TAG_COMMIT"

      - name: Validate OTA configuration
        id: ota
        run: |
          set -euo pipefail

          if [ ! -f ota.json ]; then
            echo "ERROR: ota.json does not exist."
            exit 1
          fi

          if ! jq -e '
            .compatibleNativeVersions |
            type == "array" and
            length > 0 and
            all(.[];
              type == "string" and
              test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")
            )
          ' ota.json > /dev/null; then
            echo "ERROR: ota.json must list compatible native versions in X.Y.Z format."
            exit 1
          fi

          NATIVE_VERSIONS="$(
            jq -c '.compatibleNativeVersions' ota.json
          )"

          echo "native_versions=$NATIVE_VERSIONS" \
            >> "$GITHUB_OUTPUT"

          echo "Compatible native versions:"
          echo "$NATIVE_VERSIONS"

      - name: Validate publishing settings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${R2_BUCKET:?Missing production R2_BUCKET}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Missing production CLOUDFLARE_ACCOUNT_ID}"
          if [[ "$UPDATE_CDN" != https://* ]]; then
            echo "ERROR: UPDATE_CDN must use HTTPS."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      # Download only data into a separate directory; never execute files from the build runner.
      - name: Download unsigned bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/ota-input

      - name: Encrypt and sign OTA bundle
        id: bundle
        env:
          CAPGO_PRIVATE_KEY: ${{ secrets.CAPGO_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node scripts/encrypt-ota.mjs "$RUNNER_TEMP/ota-input/bundle.zip" bundle-encrypted.zip > encrypted.json
          {
            echo "zip=bundle-encrypted.zip"
            jq -er '"checksum=" + .checksum, "session_key=" + .session_key, "upload_sha256=" + .upload_sha256' encrypted.json
          } >> "$GITHUB_OUTPUT"

      - name: Verify R2 client
        run: aws --version

      - name: Upload immutable bundle to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP_NAME: ${{ steps.bundle.outputs.zip }}
          UPLOAD_SHA256: ${{ steps.bundle.outputs.upload_sha256 }}
        run: |
          set -euo pipefail

          KEY="bundles/${VERSION}.zip"

          if aws s3api head-object \
            --bucket "$R2_BUCKET" \
            --key "$KEY" \
            --endpoint-url "$R2_ENDPOINT" \
            > /dev/null 2> "$RUNNER_TEMP/ota-head-error"
          then
            echo "Bundle already exists in R2."
            echo "Verifying that it is identical..."

            aws s3 cp \
              "s3://${R2_BUCKET}/${KEY}" \
              "${RUNNER_TEMP}/existing-bundle.zip" \
              --endpoint-url "$R2_ENDPOINT"

            EXISTING_SHA256="$(
              sha256sum "${RUNNER_TEMP}/existing-bundle.zip" |
                awk '{print $1}'
            )"

            if [ "$EXISTING_SHA256" != "$UPLOAD_SHA256" ]; then
              echo "ERROR: Bundle version already exists with different content."
              echo "Encryption uses fresh randomness on every run."
              echo "If an earlier run uploaded this version, publish a new OTA tag."
              echo "Version:  $VERSION"
              echo "Expected: $UPLOAD_SHA256"
              echo "Existing: $EXISTING_SHA256"
              exit 1
            fi

            echo "Existing R2 bundle is identical."

          else
            # A denied or failed lookup does not mean the object is absent.
            if ! grep -q 'An error occurred (404) when calling the HeadObject operation' "$RUNNER_TEMP/ota-head-error"; then
              cat "$RUNNER_TEMP/ota-head-error" >&2
              exit 1
            fi

            # The condition also prevents an overwrite if another writer wins the race.
            aws s3api put-object \
              --bucket "$R2_BUCKET" \
              --key "$KEY" \
              --body "$ZIP_NAME" \
              --if-none-match '*' \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "application/octet-stream" \
              --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Verify public bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPLOAD_SHA256: ${{ steps.bundle.outputs.upload_sha256 }}
        run: |
          set -euo pipefail

          URL="${UPDATE_CDN%/}/bundles/${VERSION}.zip"

          echo "Downloading:"
          echo "$URL"

          curl \
            --fail \
            --proto =https \
            --proto-redir =https \
            --connect-timeout 15 \
            --max-time 180 \
            --location \
            --retry 5 \
            --retry-delay 2 \
            "$URL" \
            --output "${RUNNER_TEMP}/public-bundle.zip"

          PUBLIC_SHA256="$(
            sha256sum "${RUNNER_TEMP}/public-bundle.zip" |
              awk '{print $1}'
          )"

          if [ "$PUBLIC_SHA256" != "$UPLOAD_SHA256" ]; then
            echo "ERROR: Public bundle checksum mismatch."
            echo "Expected: $UPLOAD_SHA256"
            echo "Received: $PUBLIC_SHA256"
            exit 1
          fi

          echo "Public bundle verified successfully."

      - name: Create production manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHECKSUM: ${{ steps.bundle.outputs.checksum }}
          SESSION_KEY: ${{ steps.bundle.outputs.session_key }}
          COMMIT: ${{ steps.git.outputs.commit }}
          NATIVE_VERSIONS: ${{ steps.ota.outputs.native_versions }}
        run: |
          set -euo pipefail

          : "${CHECKSUM:?Missing Capgo checksum}"
          : "${SESSION_KEY:?Missing encrypted session key}"

          PUBLISHED_AT="$(
            date -u +'%Y-%m-%dT%H:%M:%SZ'
          )"

          jq -n \
            --arg version "$VERSION" \
            --arg checksum "$CHECKSUM" \
            --arg session_key "$SESSION_KEY" \
            --arg commit "$COMMIT" \
            --arg publishedAt "$PUBLISHED_AT" \
            --argjson compatibleNativeVersions "$NATIVE_VERSIONS" \
            '{
              enabled: true,
              version: $version,
              checksum: $checksum,
              session_key: $session_key,
              compatibleNativeVersions: $compatibleNativeVersions,
              commit: $commit,
              publishedAt: $publishedAt
            }' \
            > production.json

          echo "Production manifest:"
          cat production.json

      - name: Publish production manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          aws s3 cp \
            production.json \
            "s3://${R2_BUCKET}/channels/production.json" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/json" \
            --cache-control "no-store"

          echo
          echo "OTA published successfully."
