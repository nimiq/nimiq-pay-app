name: CLA

on:
  issue_comment:
    types: [created]
  # pull_request_target so fork PRs can get comments and statuses. Safe because no job checks out PR code.
  pull_request_target:
    types: [opened, closed, reopened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (contains(github.event.comment.body, 'recheck') || contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')))
    steps:
      # Maintained fork of the archived contributor-assistant/github-action
      - uses: iainmcgin/cla-github-action@0d27e5a16278d4adb6b0c4b92f08ad27b0a21dc8 # v3.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/nimiq/nimiq-pay-app/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          # Must not be protected: the action commits each signature to it
          branch: cla-signatures
          allowlist: Albermonte,danimoh,Eligioo,fiaxh,franciscodiaz4,ii-cruz,ines-toupeira,jeffesquivels,jsdanielh,julianbauer,mar-v-in,mraveux,nibhar,paberr,PanoramicRum,sisou,Tammoovernice,viquezclaudio,dependabot[bot],*[bot]
          custom-notsigned-prcomment: Thanks for your contribution. Before we can merge it, please read our [Contributor License Agreement](https://github.com/nimiq/nimiq-pay-app/blob/main/CLA.md) and sign it by posting the comment below. Every commit author in this pull request needs to sign once.
