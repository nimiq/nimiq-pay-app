name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: nimiq-pay-app

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: nimiq-pay-app
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: nimiq-pay-app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: nimiq-pay-app/.nvmrc
          cache: pnpm
          cache-dependency-path: nimiq-pay-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: nimiq-pay-app
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: nimiq-pay-app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: nimiq-pay-app/.nvmrc
          cache: pnpm
          cache-dependency-path: nimiq-pay-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run

  build-web:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: nimiq-pay-app
          submodules: recursive
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: nimiq-pay-app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: nimiq-pay-app/.nvmrc
          cache: pnpm
          cache-dependency-path: nimiq-pay-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
