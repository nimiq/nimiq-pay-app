name: Nimiq Pay - Maestro Suite Android

on:
  push:
    branches:
      - feature/maestro-improvements
  workflow_dispatch:

jobs:
  build_android_apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Android APK
        run: |
          pnpm i18n:extract
          pnpm build:web
          pnpm ionic cap sync android
          cd android
          ./gradlew assembleDebug
          mkdir -p app/build/outputs/apk/release
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK to BrowserStack
        run: node scripts/browserstack-apk-upload.js

  upload_maestro_suite:
    needs: build_android_apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload Maestro suite to BrowserStack
        run: node scripts/browserstack-maestro-upload.js --custom-id francisco_tests

  run_browserstack_maestro:
    needs: upload_maestro_suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      BROWSERSTACK_DEVICE: "Samsung Galaxy Tab S9-13.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Maestro suite on BrowserStack
        run: >
          node scripts/browserstack-maestro-run.js
          --app NimiqPayAndroidApk
          --suite francisco_tests
          --device "Samsung Galaxy Tab S9-13.0"
          --flow flows/francisco_tests/create_new_account_with_pageObject_browserstack.yaml
          --format HTML-DETAILED
          --output nimiq-pay-tests/tests_output/maestro_report.html

  publish_results:
    needs: run_browserstack_maestro
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Publish Maestro results
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.POST_TESTS_RESULTS_TOKEN }}
          external_repository: franciscodiaz4/Maestro-Results-Nimiq-Pay-Android
          publish_dir: nimiq-pay-tests/tests_output
          keep_files: true

