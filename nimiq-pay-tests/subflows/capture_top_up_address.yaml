appId: ${APP_ID}
---
# On the Top Up screen, stores the NIM address without spaces in output.topUpAddress. Android
# shows the address as one text node, iOS as nine 4-character nodes, so the parts are copied
# in reading order (index sorts by top, then left) until the address is complete.
- runScript: ../pageObjects/android/mainFlowsAndroid.page.js

- evalScript: ${output.topUpAddress = ''; output.topUpAddressParts = 0}
- repeat:
    while:
      true: ${output.topUpAddress.length < 36 && output.topUpAddressParts < 9}
    commands:
      # Maestro matches text case-insensitively, so the regex also fits any 4-letter label; the
      # address sits between the title and Copy address.
      - copyTextFrom:
          text: ${output.topUp.addressPart}
          below: ${output.topUp.title}
          above: ${output.topUp.copyAddress}
          index: ${output.topUpAddressParts}
      # The address is grouped with (non-breaking) spaces.
      - evalScript: ${output.topUpAddress += maestro.copiedText.replace(/\s/g, ''); output.topUpAddressParts++}
- assertTrue:
    condition: ${output.topUpAddress.length == 36 && output.topUpAddress.indexOf('NQ') == 0}
    label: Captured a whole NIM address
