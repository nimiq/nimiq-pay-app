appId: ${APP_ID}
---
- runFlow: require_pin.yaml
- runScript: ../pageObjects/android/mainFlowsAndroid.page.js

- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: ${output.launchScreen.getStartedBtn}
    timeout: 45000
- tapOn: ${output.launchScreen.getStartedBtn}
- extendedWaitUntil:
    visible: ${output.onboarding.choosePinTitle}
    timeout: 10000
- inputText: ${PIN}
- extendedWaitUntil:
    visible: ${output.onboarding.confirmPinTitle}
    timeout: 10000
- inputText: ${PIN}
- waitForAnimationToEnd

- runFlow:
    when:
      visible: ${output.onboarding.biometricTitle}
    commands:
      - tapOn: ${output.onboarding.skipForNowBtn}
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: ${output.onboarding.enableNotificationsTitle}
    commands:
      - tapOn: ${output.onboarding.skipForNowBtn}
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: ${output.home.payTitle}
    timeout: 45000
# Pay shows before home takes taps: on the iOS 26 simulator a menu tap ~0.5 s
# later was ignored (about.yaml, 2 of 4 runs). Wait for the onboarding sheet to
# leave (a covered screen stays in the iOS hierarchy) and home to settle.
- extendedWaitUntil:
    notVisible: ${output.onboarding.enableNotificationsTitle}
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
