appId: ${APP_ID}
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: Get Started
    timeout: 10000
- tapOn: Get Started
- extendedWaitUntil:
    visible: Choose a PIN
    timeout: 10000
- inputText: ${PIN}
- extendedWaitUntil:
    visible: Confirm your PIN
    timeout: 10000
- inputText: ${PIN}
- waitForAnimationToEnd

- runFlow:
    when:
      visible: Biometric Authentication
    commands:
      - tapOn: Skip for now
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: Enable notifications
    commands:
      - tapOn: Skip for now
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: Pay
    timeout: 45000
