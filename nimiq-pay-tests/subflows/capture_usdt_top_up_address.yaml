appId: ${APP_ID}
---
# From home with NIM active: switches to USDT, opens Top Up, checks it is the Polygon screen and
# stores its address in output.topUpAddress, then closes it and switches back to NIM.
- runScript: ../pageObjects/android/mainFlowsAndroid.page.js

# The switch toggles between the two assets; the home balance then reads "<amount> USDT".
- tapOn: ${output.home.switchAssetBtn}
- extendedWaitUntil:
    visible: ${output.home.usdtAmount}
    timeout: 10000
- waitForAnimationToEnd
- tapOn: ${output.navigation.topUpBtn}
- extendedWaitUntil:
    visible: ${output.topUp.usdtSubtitle}
    timeout: 10000
- assertVisible: ${output.topUp.polygonWarning}
- runFlow: capture_top_up_address.yaml
- assertTrue:
    condition: ${output.topUpAddress.indexOf('0x') == 0}
    label: USDT Top Up shows a Polygon address
- tapOn: ${output.navigation.closeFlowModalBtn}
- extendedWaitUntil:
    visible: ${output.home.payTitle}
    timeout: 10000
# On iOS a tap while the flow is still closing is lost.
- waitForAnimationToEnd

- tapOn: ${output.home.switchAssetBtn}
- extendedWaitUntil:
    notVisible: ${output.home.usdtAmount}
    timeout: 10000
- waitForAnimationToEnd
