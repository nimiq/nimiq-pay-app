appId: ${APP_ID}
---
- runFlow: ../subflows/launch_app.yaml
- runFlow: ../subflows/switch_to_nim.yaml

# Open top-up modal
- tapOn: Top Up
- waitForAnimationToEnd

# Verify NIM top-up screen content (aria-label on step title)
- assertVisible: Top up address

# Verify NIM address is displayed (starts with NQ)
- assertVisible:
    text: 'NQ.*'

# Verify Copy address button
- assertVisible: Copy address

# Tap Copy address
- tapOn: Copy address
- waitForAnimationToEnd

- takeScreenshot: nimiq-pay-tests/.maestro/screenshots/top_up_address_nim

- back
