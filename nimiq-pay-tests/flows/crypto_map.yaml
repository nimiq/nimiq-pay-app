appId: ${APP_ID}
---
- runFlow: ../subflows/launch_app.yaml

# Tap Crypto Map button in header
- tapOn: Crypto Map
- waitForAnimationToEnd

# Wait for map view to load (external iframe content). The map localizes its search
# placeholder to the device system locale, so match the supported locales.
- extendedWaitUntil:
    visible:
      text: 'Search here|Buscar aquí|Suchen|Rechercher|Buscar'
    timeout: 15000

- takeScreenshot: nimiq-pay-tests/.maestro/screenshots/map_tab

# Go back to home
- back
- waitForAnimationToEnd
