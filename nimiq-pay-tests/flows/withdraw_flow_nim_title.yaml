appId: ${APP_ID}
---
- runFlow: ../subflows/launch_app.yaml
- runFlow: ../subflows/switch_to_nim.yaml

# Tap Withdraw button on home screen
- tapOn: Withdraw
- waitForAnimationToEnd

# For NIM, the flow title should be "Withdraw"
- assertVisible: Withdraw

- takeScreenshot: nimiq-pay-tests/.maestro/screenshots/withdraw_flow_nim

- back
- waitForAnimationToEnd
