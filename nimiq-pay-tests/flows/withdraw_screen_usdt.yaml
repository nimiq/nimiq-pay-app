appId: ${APP_ID}
---
- runFlow: ../subflows/launch_app.yaml
- runFlow: ../subflows/switch_to_usdt.yaml

# Open USDT withdraw screen
- tapOn: Withdraw
- waitForAnimationToEnd

# Verify USDT withdraw screen elements
- assertVisible: Withdraw
- assertVisible: USD
- assertVisible:
    text: '.*USDT'

# Verify address selector is present
- assertVisible: Select withdrawal address

# Verify quick amount buttons
- assertVisible: $25
- assertVisible: $50
- assertVisible: $100

- takeScreenshot: nimiq-pay-tests/.maestro/screenshots/withdraw_screen_usdt

# Close flow
- tapOn: close flow modal
- waitForAnimationToEnd
