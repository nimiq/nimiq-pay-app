appId: ${APP_ID}
---
- runFlow: ../subflows/launch_app.yaml
- runFlow: ../subflows/switch_to_usdt.yaml

# Open top-up modal
- tapOn: Top Up
- waitForAnimationToEnd

# Verify USDT top-up screen content. The visible "Receive USDT on Polygon" <h1> is
# shadowed in the a11y tree by the step container's aria-label ("Top up address"),
# so assert the USDT-specific description instead — it distinguishes USDT from NIM.
- assertVisible: Top up address
- assertVisible: 'Send USDT on Polygon to the address below.'

# Verify Polygon address is displayed (starts with 0x)
- assertVisible:
    text: '0x.*'

# Verify Copy address button
- assertVisible: Copy address

# Tap Copy address
- tapOn: Copy address
- waitForAnimationToEnd

- takeScreenshot: nimiq-pay-tests/.maestro/screenshots/top_up_address_usdt

- back
