appId: ${APP_ID}
---
- runFlow: ../subflows/launch_app.yaml

# Verify both Top Up and Withdraw buttons are visible on home
- assertVisible: Top Up
- assertVisible: Withdraw

# Tap Withdraw button and verify flow opens
- tapOn: Withdraw
- waitForAnimationToEnd

- takeScreenshot: nimiq-pay-tests/.maestro/screenshots/withdraw_flow_from_home

# Go back to dismiss the flow
- back
- waitForAnimationToEnd
