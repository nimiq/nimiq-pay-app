appId: ${APP_ID}
---
- runScript: ../../pageObjects/android/mainFlowsAndroid.page.js

- runFlow: ../../subflows/create_account.yaml

- tapOn: ${output.navigation.topUpBtn}
- waitForAnimationToEnd

- assertVisible: ${output.topUp.title}
- assertVisible:
    text: ${output.topUp.addressPrefix}
- assertVisible: ${output.topUp.copyAddress}

- tapOn: ${output.navigation.closeFlowModalBtn}
- waitForAnimationToEnd
- assertNotVisible: ${output.topUp.copyAddress}
- assertVisible: ${output.home.payTitle}
- stopApp
