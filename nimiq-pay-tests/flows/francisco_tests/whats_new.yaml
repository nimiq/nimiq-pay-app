appId: ${APP_ID}

tags:
  - franciscoTest

---
- runScript: ../../pageObjects/android/mainFlowsAndroid.page.js

- runFlow: ../../subflows/create_account.yaml

- tapOn: ${output.navigation.openMenuBtn}
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${output.navigation.whatsNewBtn}
    timeout: 5000
- tapOn: ${output.navigation.whatsNewBtn}
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: ${output.whatsNew.title}
    timeout: 5000
- assertVisible: ${output.whatsNew.versionHeader}
- assertNotVisible:
    text: ${output.whatsNew.versionHeader}
    index: 1
- assertVisible: ${output.whatsNew.previousVersions}

- tapOn: ${output.whatsNew.previousVersions}
- waitForAnimationToEnd
- assertVisible:
    text: ${output.whatsNew.versionHeader}
    index: 1

- back
- waitForAnimationToEnd
- assertVisible: ${output.navigation.whatsNewBtn}
- back
- waitForAnimationToEnd
- assertVisible: ${output.home.payTitle}

- stopApp