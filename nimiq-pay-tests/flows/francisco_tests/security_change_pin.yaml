appId: ${APP_ID}
name: Security change PIN

tags:
  - franciscoTest

env:
  # Any 4-digit PIN other than ${PIN}.
  NEW_PIN: "2580"

---
# Scope: Settings > Change PIN replaces ${PIN} with ${NEW_PIN}; after a relaunch the old
# PIN is rejected and the new one unlocks the wallet.
- runScript: ../../pageObjects/android/mainFlowsAndroid.page.js

- runFlow: ../../subflows/create_account.yaml

- tapOn: ${output.navigation.openMenuBtn}
- extendedWaitUntil:
    visible: ${output.navigation.settingsBtn}
    timeout: 5000
- tapOn: ${output.navigation.settingsBtn}
- extendedWaitUntil:
    visible: ${output.settings.changePin}
    timeout: 5000
- tapOn: ${output.settings.changePin}

- extendedWaitUntil:
    visible: ${output.changePin.currentPinTitle}
    timeout: 10000
- inputText: ${PIN}
- extendedWaitUntil:
    visible: ${output.onboarding.choosePinTitle}
    timeout: 10000
- inputText: ${NEW_PIN}
- extendedWaitUntil:
    visible: ${output.onboarding.confirmPinTitle}
    timeout: 10000
- inputText: ${NEW_PIN}

# The flow closes back to the menu once the database secret has been changed.
- extendedWaitUntil:
    visible: ${output.navigation.backupAccountBtn}
    timeout: 15000
- assertNotVisible: ${output.onboarding.confirmPinTitle}

- stopApp
- launchApp:
    clearState: false
# Same cold-start budget as create_account.yaml; shorter waits flaked on a loaded emulator.
- extendedWaitUntil:
    visible: ${output.onboarding.enterPinTitle}
    timeout: 45000
- assertNotVisible: ${output.home.payTitle}

- inputText: ${PIN}
- extendedWaitUntil:
    visible: ${output.unlock.invalidPinError}
    timeout: 15000
- assertNotVisible: ${output.home.payTitle}

# Let the error wiggle and the PIN reset finish so no digit of the next PIN is dropped,
# then check the wallet is still locked.
- waitForAnimationToEnd
- assertNotVisible: ${output.home.payTitle}
- inputText: ${NEW_PIN}
- extendedWaitUntil:
    visible: ${output.home.payTitle}
    timeout: 30000
- assertNotVisible: ${output.onboarding.enterPinTitle}
- assertVisible: ${output.navigation.topUpBtn}

- stopApp
