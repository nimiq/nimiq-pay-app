appId: ${APP_ID}

tags:
  - franciscoTest

---
- runFlow: ../../subflows/require_pin.yaml
- runScript: ../../pageObjects/android/mainFlowsAndroid.page.js

- launchApp:
    clearState: true

# Cold start after clearState: same budget as create_account.yaml.
- extendedWaitUntil:
    visible: ${output.launchScreen.getStartedBtn}
    timeout: 45000
- tapOn: ${output.launchScreen.getStartedBtn}
- extendedWaitUntil:
    visible: ${output.onboarding.choosePinTitle}
    timeout: 10000
- inputText: ${PIN}
- extendedWaitUntil:
    visible: ${output.onboarding.confirmPinTitle}
    timeout: 10000
- inputText: ${PIN}
- waitForAnimationToEnd

- runFlow:
    when:
      visible: ${output.onboarding.biometricTitle}
    commands:
      - tapOn: ${output.onboarding.skipForNowBtn}
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: ${output.onboarding.enableNotificationsTitle}
    commands:
      - tapOn: ${output.onboarding.skipForNowBtn}
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: ${output.home.payTitle}
    timeout: 10000

- stopApp
