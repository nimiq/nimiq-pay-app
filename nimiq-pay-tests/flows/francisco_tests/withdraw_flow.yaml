appId: ${APP_ID}
---
- runFlow: ../../subflows/create_account.yaml

- tapOn: Withdraw
- waitForAnimationToEnd

- assertVisible: Withdraw
- assertVisible: USD
- assertVisible:
    text: '.*NIM'
- assertVisible:
    text: 'Select an address.*'
- assertVisible: $25
- assertVisible: $50
- assertVisible: $100

- tapOn: close flow modal
- waitForAnimationToEnd
- stopApp
