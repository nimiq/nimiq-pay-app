appId: ${APP_ID}
name: Returning to app Flows and settings

tags:
  - franciscoTest

---
# Scope: existing user returns to the app, then walks through Settings, Backup account,
# What's New, About, and the main home flows (Top Up, Withdraw, Crypto Map, Earn Points),
# verifying state survives an app restart (stopApp + relaunch with clearState: false).
- runScript: ../../pageObjects/android/mainFlowsAndroid.page.js

- runFlow: ../../subflows/returning_to_dashboard.yaml

- tapOn: ${output.navigation.openMenuBtn}
- extendedWaitUntil:
    visible: ${output.settings.title}
    timeout: 5000
- tapOn: ${output.navigation.settingsBtn}
- extendedWaitUntil:
    visible: ${output.settings.title}
    timeout: 5000

- assertVisible: ${output.settings.language}
- assertVisible: ${output.settings.currency}
- assertVisible: ${output.settings.minimumNimDecimals}
- assertVisible:
    text: ${output.settings.autoDepositThreshold}
- assertVisible: ${output.settings.pushNotifications}
- assertVisible: ${output.settings.reduceAnimations}
- assertVisible: ${output.settings.changePin}

- tapOn: ${output.navigation.backBtn}
- waitForAnimationToEnd
# The menu stays in the hierarchy under Settings, so check Settings itself is gone.
- assertNotVisible: ${output.settings.changePin}
- assertVisible: ${output.navigation.backupAccountBtn}
- tapOn:
    point: ${output.navigation.sheetBackdrop}
- waitForAnimationToEnd
- assertNotVisible: ${output.navigation.backupAccountBtn}
- assertVisible: ${output.home.payTitle}

- tapOn: ${output.navigation.openMenuBtn}
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${output.navigation.backupAccountBtn}
    timeout: 5000
- tapOn: ${output.navigation.backupAccountBtn}
- waitForAnimationToEnd

- assertVisible: ${output.backup.introTitle}
- assertVisible: ${output.backup.introDescription}
- assertVisible: ${output.backup.noOneCanSeeBtn}
- tapOn: ${output.backup.noOneCanSeeBtn}
- waitForAnimationToEnd
- assertVisible: ${output.backup.showWordsTitle}
- assertVisible: ${output.backup.continueBtn}
- tapOn: ${output.backup.continueBtn}
- waitForAnimationToEnd
- assertVisible: ${output.backup.validateTitle}
- assertVisible: ${output.backup.question}
- tapOn: ${output.navigation.closeFlowModalBtn}
- waitForAnimationToEnd
- assertNotVisible: ${output.backup.question}
- assertVisible: ${output.home.payTitle}

- tapOn: ${output.navigation.openMenuBtn}
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${output.navigation.whatsNewBtn}
    timeout: 5000
- tapOn: ${output.navigation.whatsNewBtn}
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${output.whatsNew.title}
    timeout: 5000
- assertVisible: ${output.whatsNew.versionHeader}
- assertNotVisible:
    text: ${output.whatsNew.versionHeader}
    index: 1
# A long latest entry can push the button below the fold, where Maestro still finds it with
# zero-height bounds but the tap misses; scrollUntilVisible rejects zero-height bounds.
- scrollUntilVisible:
    element: ${output.whatsNew.previousVersions}
- tapOn: ${output.whatsNew.previousVersions}
- waitForAnimationToEnd
# Only the expansion renders a second header; unlike assertVisible, this rejects one below the fold.
- scrollUntilVisible:
    element:
      text: ${output.whatsNew.versionHeader}
      index: 1
- tapOn: ${output.whatsNew.closeBtn}
- waitForAnimationToEnd
# The menu stays in the hierarchy under What's New, so check the changelog itself is gone.
- assertNotVisible: ${output.whatsNew.previousVersions}
# Log Out, not What's New: home also shows a "What's New" card.
- assertVisible: ${output.navigation.logoutBtn}
- tapOn:
    point: ${output.navigation.sheetBackdrop}
- waitForAnimationToEnd
- assertNotVisible: ${output.navigation.logoutBtn}
- assertVisible: ${output.home.payTitle}

- tapOn: ${output.navigation.openMenuBtn}
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${output.navigation.aboutBtn}
    timeout: 5000
- tapOn: ${output.navigation.aboutBtn}
- runFlow:
    when:
      visible: ${output.about.staySignedOutBtn}
    commands:
      - tapOn: ${output.about.staySignedOutBtn}
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${output.about.pageUrl}
    timeout: 10000
- assertVisible: ${output.about.pageUrl}

- stopApp
- launchApp:
    clearState: false
# Same cold-start budget as create_account.yaml; shorter waits flaked on a loaded emulator.
- extendedWaitUntil:
    visible: ${output.onboarding.enterPinTitle}
    timeout: 45000
- assertNotVisible: ${output.home.payTitle}
- inputText: ${PIN}
- extendedWaitUntil:
    visible: ${output.home.payTitle}
    timeout: 10000
- assertVisible: ${output.navigation.topUpBtn}
- assertVisible: ${output.navigation.withdrawBtn}
- assertVisible: ${output.home.payTitle}
- assertVisible: ${output.navigation.openMenuBtn}
- assertVisible: ${output.navigation.earnPointsBtn}

- tapOn: ${output.navigation.topUpBtn}
- waitForAnimationToEnd
- assertVisible: ${output.topUp.title}
- assertVisible:
    text: ${output.topUp.addressPrefix}
- assertVisible: ${output.topUp.copyAddress}
- tapOn: ${output.navigation.closeFlowModalBtn}
- waitForAnimationToEnd
- assertNotVisible: ${output.topUp.copyAddress}
- assertVisible: ${output.home.payTitle}

- tapOn: ${output.navigation.withdrawBtn}
- waitForAnimationToEnd
- assertVisible: ${output.withdraw.title}
- assertVisible: ${output.withdraw.usd}
- assertVisible:
    text: ${output.withdraw.nim}
- assertVisible:
    text: ${output.withdraw.selectAddress}
- assertVisible: ${output.withdraw.amount25}
- assertVisible: ${output.withdraw.amount50}
- assertVisible: ${output.withdraw.amount100}
- tapOn: ${output.navigation.closeFlowModalBtn}
- waitForAnimationToEnd
- assertNotVisible: ${output.withdraw.amount25}
- assertVisible: ${output.home.payTitle}

- runFlow:
    when:
      visible: ${output.navigation.closeNotificationCardBtn}
    commands:
      - tapOn: ${output.navigation.closeNotificationCardBtn}
      - waitForAnimationToEnd
- assertVisible: ${output.navigation.cryptoMapBtn}
- tapOn: ${output.navigation.cryptoMapBtn}
- waitForAnimationToEnd
- assertVisible: ${output.cryptocityMap.closeBtn}
- tapOn: ${output.cryptocityMap.closeBtn}
- waitForAnimationToEnd
- assertNotVisible: ${output.cryptocityMap.closeBtn}
- assertVisible: ${output.home.payTitle}

- assertVisible: ${output.navigation.earnPointsBtn}
- tapOn: ${output.navigation.earnPointsBtn}
- waitForAnimationToEnd
- assertVisible: ${output.cryptocityPoints.comingSoonMessage}
- tapOn: ${output.navigation.closeFlowModalBtn}
- waitForAnimationToEnd
- assertNotVisible: ${output.cryptocityPoints.comingSoonMessage}
- assertVisible: ${output.home.payTitle}

- stopApp