appId: ${APP_ID}
name: Create account and return to account

tags:
  - franciscoTest

---
- runFlow: ../../subflows/require_pin.yaml
- runScript: ../../pageObjects/android/mainFlowsAndroid.page.js

- launchApp:
    clearState: true

# Cold start after clearState: same budget as create_account.yaml.
- extendedWaitUntil:
    visible: ${output.launchScreen.getStartedBtn}
    timeout: 45000
- tapOn: ${output.launchScreen.getStartedBtn}
- extendedWaitUntil:
    visible: ${output.onboarding.choosePinTitle}
    timeout: 10000
- inputText: ${PIN}
- extendedWaitUntil:
    visible: ${output.onboarding.confirmPinTitle}
    timeout: 10000
- inputText: ${PIN}
- waitForAnimationToEnd

- runFlow:
    when:
      visible: ${output.onboarding.biometricTitle}
    commands:
      - tapOn: ${output.onboarding.skipForNowBtn}
      - waitForAnimationToEnd

- runFlow:
    when:
      visible: ${output.onboarding.enableNotificationsTitle}
    commands:
      - tapOn: ${output.onboarding.skipForNowBtn}
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: ${output.home.payTitle}
    timeout: 10000

- stopApp
- launchApp:
    clearState: false

# Same cold-start budget as create_account.yaml; shorter waits flaked on a loaded emulator.
- extendedWaitUntil:
    visible: ${output.onboarding.enterPinTitle}
    timeout: 45000
- assertNotVisible: ${output.home.payTitle}
- inputText: ${PIN}
- extendedWaitUntil:
    visible: ${output.home.payTitle}
    timeout: 10000

- assertVisible: ${output.navigation.topUpBtn}
- assertVisible: ${output.navigation.withdrawBtn}
- assertVisible: ${output.home.payTitle}
- assertVisible: ${output.home.switchAssetBtn}
- assertVisible: ${output.navigation.openMenuBtn}
- assertVisible: ${output.navigation.earnPointsBtn}