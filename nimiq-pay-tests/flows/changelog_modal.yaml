appId: ${APP_ID}
---
- runFlow: ../subflows/launch_app.yaml

# Open hamburger menu
- tapOn: Open menu
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: Settings
    timeout: 5000

# Open the changelog from the menu
- assertVisible: What's New
- tapOn: What's New
- waitForAnimationToEnd

# Changelog modal shows the latest version entry
- extendedWaitUntil:
    visible: Version
    timeout: 5000

- takeScreenshot: nimiq-pay-tests/.maestro/screenshots/changelog_modal

# Expand older versions when there is history (collapsible only renders with >1 entry)
- runFlow:
    when:
      visible: Previous versions
    commands:
      - tapOn: Previous versions
      - waitForAnimationToEnd

# Close modal
- back
- waitForAnimationToEnd
